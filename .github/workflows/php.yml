name: PHP Composer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: "linting:    php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5', '8.6' ]
        typo3: [ '13', '14' ]
        include:
          # phpro/grumphp does not allow PHP 8.6 yet
          - php: '8.6'
            ignorePlatformReqs: '--ignore-platform-req=php+'
    steps:
    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}

    - uses: actions/checkout@v7
    - run: composer update --with=typo3/cms-core:^${{ matrix.typo3 }} ${{ matrix.ignorePlatformReqs }}
    # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. phpro/grumphp)
    - if: matrix.php == '8.6'
      run: composer check-platform-reqs --no-dev
    - run: vendor/bin/grumphp run
    - run: composer test
